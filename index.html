<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SP 시뮬레이션 운영 설계 · 가상 외래 공간 (WebXR)</title>
<link rel="icon" href="data:,">
<style>
  :root{--bg:#0f1720;--panel:#18232f;--line:#2a3a4a;--fg:#e8eef5;--mute:#93a4b5;--acc:#4cc2ff;--rec:#ff5a5f}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--fg);
    font-family:"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo","Nanum Gothic",sans-serif}
  .wrap{max-width:1280px;margin:0 auto;padding:18px 16px 40px}
  h1{font-size:20px;margin:4px 0 14px;font-weight:700}
  h1 small{font-size:12px;font-weight:600;color:var(--acc);border:1px solid var(--acc);border-radius:99px;padding:2px 8px;margin-left:8px;vertical-align:2px}
  .stage{position:relative;background:#000;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
  #view{display:block;width:100%;height:auto;aspect-ratio:16/9}
  #recbadge{position:absolute;right:14px;top:12px;background:var(--rec);color:#fff;font-weight:700;font-size:13px;padding:4px 10px;border-radius:99px}
  #recbadge[hidden]{display:none}
  .bar{display:flex;gap:10px;align-items:center;margin-top:12px}
  .bar input[type=range]{flex:1;accent-color:var(--acc)}
  button{font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 14px;cursor:pointer}
  button:hover:not(:disabled){border-color:var(--acc)}
  button:disabled{opacity:.45;cursor:not-allowed}
  button.rec{background:var(--rec);border-color:var(--rec);color:#fff;font-weight:700}
  #time{font-variant-numeric:tabular-nums;color:var(--mute);min-width:96px;text-align:right}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  .chips button{padding:6px 12px;font-size:14px;border-radius:99px}
  .chips button.on{background:var(--acc);border-color:var(--acc);color:#06202e;font-weight:700}
  .actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:14px}
  #msg{color:var(--mute);font-size:14px}
  .note{color:var(--mute);font-size:13px;line-height:1.7;margin-top:18px;border-top:1px solid var(--line);padding-top:14px}
  .note b{color:var(--fg)}
</style>
<script type="importmap">
{"imports":{"three":"./three.min.js"}}
</script>
</head>
<body>
<div class="wrap">
  <h1>SP 시뮬레이션 운영 설계 · 가상 외래 공간 <small>WebXR</small></h1>
  <div class="stage">
    <canvas id="view" width="1280" height="720"></canvas>
    <div id="recbadge" hidden>● 녹화 중</div>
  </div>
  <div class="bar">
    <button id="play">⏸ 일시정지</button>
    <button id="restart">⏮ 처음부터</button>
    <input id="seek" type="range" min="0" max="100" step="0.05" value="0" aria-label="재생 위치">
    <span id="time">0:00 / 0:00</span>
  </div>
  <div class="chips" id="chips"></div>
  <div class="actions">
    <button id="save" class="rec">● 영상으로 저장</button>
    <button id="vr">🥽 VR로 보기</button>
    <span id="msg"></span>
  </div>
  <div class="note">
    <b>영상으로 저장</b>을 누르면 처음부터 자동 재생하면서 화면(자막 포함)을 녹화하고, 끝나면 파일이 내려받아집니다.
    녹화 중에는 이 탭을 다른 탭으로 바꾸지 마세요. Chrome 또는 Edge를 권장합니다.<br>
    <b>VR로 보기</b>는 WebXR을 지원하는 헤드셋 브라우저(예: Meta Quest 브라우저)에서 동작합니다. 트리거 버튼을 누르면 다음 위치로 이동합니다.<br>
    단축키: <b>Space</b> 재생/일시정지 · <b>←/→</b> 5초 이동 · <b>1~8</b> 챕터 이동
  </div>
</div>

<script type="module">
import * as THREE from 'three';

/* ================= 기본 설정 ================= */
const W = 1280, H = 720;
const FONT = '"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo","Nanum Gothic","Noto Sans CJK KR",sans-serif';
const $ = id => document.getElementById(id);
const view = $('view'), ctx = view.getContext('2d');
const params = new URLSearchParams(location.search);
const SPEED = Math.max(0.1, parseFloat(params.get('speed')) || 1); // 테스트용 배속

function rr(c, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  c.beginPath();
  c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}

/* ================= 렌더러 / 장면 ================= */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H, false);
renderer.shadowMap.enabled = true;
renderer.xr.enabled = true;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xdfe6ec);
const dolly = new THREE.Group(); scene.add(dolly);
const camera = new THREE.PerspectiveCamera(58, W / H, 0.05, 200);
dolly.add(camera);

scene.add(new THREE.HemisphereLight(0xffffff, 0xaab7c4, 1.5));
const sun = new THREE.DirectionalLight(0xffffff, 2.4);
sun.position.set(-6, 16, 12); sun.target.position.set(0, 0, -1);
sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -18, right: 18, top: 14, bottom: -14, near: 1, far: 50 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.03;
scene.add(sun, sun.target);

/* ---------- 도우미 ---------- */
const mat = (c, p = {}) => new THREE.MeshStandardMaterial({ color: c, roughness: .85, metalness: 0, ...p });
function box(w, h, d, c, x, y, z, o = {}) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), o.mat || mat(c, o.p));
  m.position.set(x, y, z); m.castShadow = o.cast !== false; m.receiveShadow = true;
  (o.parent || scene).add(m); return m;
}
function cyl(rt, rb, h, c, x, y, z, o = {}) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, o.seg || 24), o.mat || mat(c, o.p));
  m.position.set(x, y, z); m.castShadow = o.cast !== false; m.receiveShadow = true;
  (o.parent || scene).add(m); return m;
}
const hl = { phone: [], bp: [], card: [], wheel: [], bed: [] };   // 강조(깜빡임) 대상
function mark(name, ...meshes) {
  meshes.forEach(m => { m.material.emissive.set(0xffa000); m.material.emissiveIntensity = 0; hl[name].push(m.material); });
}
function face(g, tx, tz) { g.rotation.y = Math.atan2(-(tx - g.position.x), -(tz - g.position.z)); }

/* ---------- 라벨(스프라이트) ---------- */
const labelGroups = [];
function mkLabel(text, { k = .0042, size = 40, dot = '#1d9bf0', bg = 'rgba(255,255,255,.96)', fg = '#14202b' } = {}) {
  const c = document.createElement('canvas'), x = c.getContext('2d');
  x.font = `700 ${size}px ${FONT}`;
  const tw = Math.ceil(x.measureText(text).width), pad = Math.round(size * .55), dr = Math.round(size * .28), gap = Math.round(size * .3);
  const w = tw + pad * 2 + dr * 2 + gap, h = Math.round(size * 1.9);
  c.width = w; c.height = h;
  x.font = `700 ${size}px ${FONT}`; x.textBaseline = 'middle';
  rr(x, 2, 2, w - 4, h - 4, h / 2); x.fillStyle = bg; x.fill();
  x.lineWidth = 3; x.strokeStyle = 'rgba(20,32,43,.2)'; x.stroke();
  x.fillStyle = dot; x.beginPath(); x.arc(pad + dr, h / 2, dr, 0, 7); x.fill();
  x.fillStyle = fg; x.fillText(text, pad + dr * 2 + gap, h / 2 + 2);
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 4;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false }));
  sp.scale.set(w * k, h * k, 1); sp.center.set(.5, 0); sp.renderOrder = 20; return sp;
}
const IN = '#1d9bf0', OUT = '#e5484d', ROLE = '#2e9e6b', PROP = '#f59e0b';
function addLabel(text, x, y, z, tags, o = {}, parent = scene) {
  const s = mkLabel(text, o); s.position.set(x, y, z); parent.add(s); labelGroups.push({ obj: s, tags }); return s;
}

/* ================= 공간 만들기 ================= */
// 바닥
box(26, .1, 16, 0xe9e4da, 0, -.05, 0, { cast: false });
box(8, .02, 8, 0xd6e6f2, 7, .011, -3, { cast: false });
// 처치실(시뮬레이션 안) 경계선
const edge = (w, d, x, z) => box(w, .03, d, 0x1d9bf0, x, .03, z, { cast: false });
edge(8, .08, 7, -7 + .04); edge(8, .08, 7, 1 - .04); edge(.08, 8, 3 + .04, -3); edge(.08, 8, 11 - .04, -3);

// 벽
box(26, 3.2, .2, 0xf2f4f6, 0, 1.6, -7.1);                 // 뒷벽
box(.2, 3.2, 16, 0xf2f4f6, -13.1, 1.6, 0);                // 왼벽
box(14, 3.2, .2, 0xf2f4f6, 6, 1.6, 8.1);                  // 앞벽(복도 쪽)
const glass = () => mat(0xffffff, { transparent: true, opacity: .32, roughness: .3, depthWrite: false });
const wall = (w, d, x, z) => {
  box(w, 3, d, 0xffffff, x, 1.5, z, { mat: glass(), cast: false });
  box(w + .02, .22, d + .02, 0x7fa8c9, x, .11, z, { cast: false });
};
wall(.15, 3.7, 3, -5.15);        // 왼쪽 벽(문 위쪽 구간)
wall(.15, 3.0, 3, -.5);          // 왼쪽 벽(문 아래쪽 구간)
wall(8, .15, 7, 1);              // 앞쪽 벽
wall(.15, 8, 11, -3);            // 오른쪽 벽
box(.15, .8, 1.3, 0xffffff, 3, 2.6, -2.65, { mat: glass(), cast: false });     // 문 위
[-3.3, -2.0].forEach(z => box(.12, 2.2, .12, 0x6b7f92, 3, 1.1, z));            // 문틀

// 접수
box(4.2, 1.05, .9, 0xb7a58f, -9, .525, -5.3);
box(4.4, .06, 1.1, 0xf5f1ea, -9, 1.08, -5.3);
box(.6, .4, .05, 0x20262d, -9.9, 1.5, -5.5); box(.06, .25, .06, 0x20262d, -9.9, 1.2, -5.5);
box(.4, .01, .3, 0xffffff, -8.2, 1.115, -5.1);
const recepWall = new THREE.Mesh(new THREE.PlaneGeometry(4.4, .8),
  (() => { const c = document.createElement('canvas'); c.width = 1100; c.height = 200; const x = c.getContext('2d');
    x.fillStyle = '#2b6cb0'; rr(x, 0, 0, 1100, 200, 28); x.fill(); x.fillStyle = '#fff'; x.font = `700 92px ${FONT}`;
    x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText('산부인과 외래 접수', 550, 106);
    const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return new THREE.MeshBasicMaterial({ map: t }); })());
recepWall.position.set(-9, 2.5, -6.98); scene.add(recepWall);

// 대기석
function chair(color) {
  const g = new THREE.Group();
  box(.6, .08, .55, color, 0, .45, 0, { parent: g });
  box(.6, .5, .07, color, 0, .74, .24, { parent: g });
  [[-.25, -.22], [.25, -.22], [-.25, .22], [.25, .22]].forEach(([x, z]) => box(.05, .42, .05, 0x59636d, x, .21, z, { parent: g }));
  scene.add(g); return g;
}
[1.0, 3.0].forEach(z => [-10, -8.5, -7, -5.5, -4].forEach(x => { const c = chair(0x4a6fa5); c.position.set(x, 0, z); }));

// 처치실 소품 ─ 책상 구역
box(2.7, .78, .9, 0xc8b8a2, 9.4, .39, -6.4);
box(2.8, .05, 1.0, 0xe8dfd0, 9.4, .805, -6.4);
const bpUnit = box(.45, .32, .28, 0xf4f4f4, 10.2, .99, -6.45);
const bpCuff = box(.32, .08, .16, 0xff9f1c, 9.75, .87, -6.2);
const bpCanvas = document.createElement('canvas'); bpCanvas.width = 256; bpCanvas.height = 112;
const bpTex = new THREE.CanvasTexture(bpCanvas); bpTex.colorSpace = THREE.SRGBColorSpace;
function setBP(txt, alert) {
  const x = bpCanvas.getContext('2d');
  x.fillStyle = '#0b1a12'; x.fillRect(0, 0, 256, 112);
  x.fillStyle = alert ? '#ff5a5f' : '#5cf29a'; x.font = '700 62px monospace'; x.textAlign = 'center'; x.textBaseline = 'middle';
  x.fillText(txt || '--/---', 128, 48);
  x.font = '700 22px sans-serif'; x.fillStyle = '#9ab'; x.fillText('mmHg', 128, 92);
  bpTex.needsUpdate = true;
}
const bpScreen = new THREE.Mesh(new THREE.PlaneGeometry(.36, .157), new THREE.MeshBasicMaterial({ map: bpTex }));
bpScreen.position.set(10.2, .99, -6.305); scene.add(bpScreen);
mark('bp', bpUnit, bpCuff);
const phoneBase = box(.3, .07, .22, 0x2a2f36, 8.7, .865, -6.4);
const phoneHand = box(.26, .05, .07, 0x1d232a, 8.7, .925, -6.4);
mark('phone', phoneBase, phoneHand);
cyl(.07, .08, .06, 0xd4af37, 9.2, .86, -6.2);                                     // 호출벨
box(.26, .012, .34, 0xffffff, 9.55, .835, -6.05).rotation.y = .3;                 // 산모수첩·결과지
box(.26, .012, .34, 0xfff6d6, 9.0, .835, -6.6).rotation.y = -.2;

// 환자용 의자·침상
const pChair = chair(0x6b8f71); pChair.position.set(8.4, 0, -4.2);
box(.95, .45, 2.0, 0x9fb2c2, 10.4, .3, -1.8);
const bedTop = box(.9, .12, 1.95, 0xdfe7ee, 10.4, .58, -1.8);
box(.7, .12, .4, 0xffffff, 10.4, .7, -2.55);
mark('bed', bedTop);
const nst1 = cyl(.07, .07, .04, 0xff9f1c, 10.28, .66, -1.5); const nst2 = cyl(.07, .07, .04, 0xff9f1c, 10.52, .66, -1.3);
box(.8, .02, .1, 0x7a8591, 10.4, .655, -1.4);
mark('bed', nst1, nst2);

// 경과 시간 카드
const cardCanvas = document.createElement('canvas'); cardCanvas.width = 360; cardCanvas.height = 240;
const cardTex = new THREE.CanvasTexture(cardCanvas); cardTex.colorSpace = THREE.SRGBColorSpace;
let cardText = '';
function setCard(t) {
  if (t === cardText) return; cardText = t;
  const x = cardCanvas.getContext('2d');
  x.fillStyle = '#fffdf5'; x.fillRect(0, 0, 360, 240); x.strokeStyle = '#d97706'; x.lineWidth = 10; x.strokeRect(5, 5, 350, 230);
  x.fillStyle = '#7c2d12'; x.textAlign = 'center'; x.textBaseline = 'middle';
  const size = t.length > 8 ? 42 : 56; x.font = `700 ${size}px ${FONT}`;
  const mid = t.length > 8 ? Math.ceil(t.length / 2) : t.length;
  if (t.length > 8) { x.fillText(t.slice(0, mid), 180, 92); x.fillText(t.slice(mid), 180, 150); } else x.fillText(t, 180, 120);
  cardTex.needsUpdate = true;
}
const cardG = new THREE.Group(); cardG.position.set(9.9, 0, .2); cardG.rotation.y = Math.atan2(6 - 9.9, -1 - .2); scene.add(cardG);
cyl(.025, .025, 1.3, 0x555e68, 0, .65, 0, { parent: cardG });
cyl(.25, .27, .03, 0x555e68, 0, .015, 0, { parent: cardG });
const cardBody = box(.62, .42, .03, 0xffffff, 0, 1.45, 0, { parent: cardG });
const cardFace = new THREE.Mesh(new THREE.PlaneGeometry(.58, .38), new THREE.MeshBasicMaterial({ map: cardTex }));
cardFace.position.set(0, 1.45, .02); cardG.add(cardFace);
mark('card', cardBody);

// 휠체어
const wc = new THREE.Group(); wc.position.set(4.6, 0, -.3); scene.add(wc);
const wcSeat = box(.5, .06, .5, 0x4a6580, 0, .5, 0, { parent: wc });
const wcBack = box(.5, .45, .05, 0x4a6580, 0, .78, .25, { parent: wc });
box(.04, .5, .04, 0x2b3a4a, -.27, .25, -.2, { parent: wc }); box(.04, .5, .04, 0x2b3a4a, .27, .25, -.2, { parent: wc });
[-.3, .3].forEach(x => { const w = cyl(.3, .3, .04, 0x1b232c, x, .3, .08, { parent: wc }); w.rotation.z = Math.PI / 2; });
mark('wheel', wcSeat, wcBack);

// 복도 문 · 시뮬레이션 밖 경로
[[5.5, '초음파실'], [10, '채혈채뇨실']].forEach(([x]) => {
  [-.6, .6].forEach(dx => box(.1, 2.3, .14, 0x6b7f92, x + dx, 1.15, 7.95));
  box(1.3, .12, .14, 0x6b7f92, x, 2.3, 7.95);
  box(1.1, 2.15, .06, 0x9fb3c6, x, 1.075, 8.0);
});
const path = [[2.4, -2.65], [1.6, -2.65], [1.6, 4.4], [10, 4.4], [10, 6.9]];
for (let i = 0; i < path.length - 1; i++) {
  const [ax, az] = path[i], [bx, bz] = path[i + 1];
  const len = Math.hypot(bx - ax, bz - az), n = Math.floor(len / .7);
  for (let k = 0; k < n; k++) {
    const u = (k + .5) / n, px = ax + (bx - ax) * u, pz = az + (bz - az) * u;
    const d = box(Math.abs(bx - ax) > 0 ? .4 : .12, .02, Math.abs(bz - az) > 0 ? .4 : .12, 0xf59e0b, px, .035, pz, { cast: false });
  }
}

/* ================= 인물 ================= */
function person(color, { sit = false, belly = false } = {}) {
  const g = new THREE.Group(), body = mat(color), pants = mat(0x3b4a5a), skin = mat(0xf0c8a4);
  const add = (geo, m, x, y, z, rz = 0) => { const o = new THREE.Mesh(geo, m); o.position.set(x, y, z); o.rotation.z = rz; o.castShadow = true; o.receiveShadow = true; g.add(o); return o; };
  let ty;
  if (!sit) {
    add(new THREE.CylinderGeometry(.085, .075, .82, 12), pants, -.1, .41, 0);
    add(new THREE.CylinderGeometry(.085, .075, .82, 12), pants, .1, .41, 0);
    ty = 1.14;
  } else {
    add(new THREE.BoxGeometry(.15, .15, .5), pants, -.1, .52, -.22); add(new THREE.BoxGeometry(.15, .15, .5), pants, .1, .52, -.22);
    add(new THREE.BoxGeometry(.12, .45, .12), pants, -.1, .25, -.47); add(new THREE.BoxGeometry(.12, .45, .12), pants, .1, .25, -.47);
    ty = .78;
  }
  add(new THREE.CylinderGeometry(.2, .22, .66, 16), body, 0, ty, 0);
  add(new THREE.CylinderGeometry(.05, .05, .55, 10), body, -.28, ty - .03, 0, .12);
  add(new THREE.CylinderGeometry(.05, .05, .55, 10), body, .28, ty - .03, 0, -.12);
  if (belly) add(new THREE.SphereGeometry(.27, 20, 16), body, 0, ty - .08, -.2);
  const hy = ty + .33 + .17;
  add(new THREE.SphereGeometry(.15, 20, 16), skin, 0, hy, 0);
  add(new THREE.BoxGeometry(.05, .05, .07), skin, 0, hy - .01, -.15);
  g.userData.top = hy + .22;
  scene.add(g); return g;
}
const recep = person(0x5ab88a); recep.position.set(-9, 0, -6.3); face(recep, -9, -4);
const pStand = person(0xd96ca8, { belly: true }), pSit = person(0xd96ca8, { sit: true, belly: true });
const learner = person(0x2f80ed), evalr = person(0x8b95a1);

addLabel('산모', 0, pStand.userData.top, 0, ['pat'], { dot: IN }, pStand);
addLabel('산모', 0, pSit.userData.top, 0, ['pat'], { dot: IN }, pSit);
addLabel('SP (산모 역)', 0, pStand.userData.top, 0, ['roles'], { dot: ROLE }, pStand);
addLabel('SP (산모 역)', 0, pSit.userData.top, 0, ['roles'], { dot: ROLE }, pSit);
addLabel('학습자 (외래 신규 간호사)', 0, learner.userData.top, 0, ['roles', 'entry'], { dot: ROLE }, learner);
addLabel('평가자 (관찰)', 0, evalr.userData.top, 0, ['roles'], { dot: ROLE }, evalr);

/* 위치 라벨 */
addLabel('접수 데스크', -7.4, 1.25, -4.7, ['reception'], { dot: IN });

  if (!xrActive) {
    dolly.position.set(0, 0, 0); dolly.rotation.set(0, 0, 0);
    if (playing) { t += dt; if (t >= TOTAL) { t = TOTAL - .001; playing = false; onEnd(); } }
    const i = shotIndexAt(t); if (i !== cur) { cur = i; applyState(SHOTS[i]); }
    const s = SHOTS[i], lt = t - s.t0;
    poseCamera(s, lt); if (s.update) s.update(lt);
    const k = .35 + .35 * Math.sin(now / 160);
    for (const n in hl) { const on = (s.pulse || []).includes(n); hl[n].forEach(m => m.emissiveIntensity = on ? k : 0); }
    renderer.render(scene, camera);
    drawHUD(s, lt, i);
    syncUI();
  } else {
    renderer.render(scene, camera);
  }
}
renderer.setAnimationLoop(now => frame(now));

/* ================= UI ================= */
const mmss = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
const seekEl = $('seek'), timeEl = $('time'), playEl = $('play'), msg = $('msg'), chipsEl = $('chips');
seekEl.max = TOTAL; let uiAcc = 0, lastChip = -1;
CHAPTERS.forEach((c, k) => {
  const b = document.createElement('button'); b.textContent = `${k + 1}. ${c.n}`; b.onclick = () => { if (recording) return; seek(c.t); }; chipsEl.appendChild(b);
});
function syncUI() {
  if (performance.now() - uiAcc < 120) return; uiAcc = performance.now();
  if (document.activeElement !== seekEl) seekEl.value = t;
  timeEl.textContent = `${mmss(t)} / ${mmss(TOTAL)}`;
  playEl.textContent = playing ? '⏸ 일시정지' : (t >= TOTAL - .01 ? '↻ 다시 재생' : '▶ 재생');
  let ci = 0; CHAPTERS.forEach((c, k) => { if (t >= c.t) ci = k; });
  if (ci !== lastChip) { [...chipsEl.children].forEach((b, k) => b.classList.toggle('on', k === ci)); lastChip = ci; }
}
playEl.onclick = () => { if (recording) return; if (t >= TOTAL - .01) seek(0); playing = !playing; };
$('restart').onclick = () => { if (recording) return; seek(0); playing = true; };
seekEl.oninput = () => { if (recording) return; playing = false; seek(parseFloat(seekEl.value)); };
addEventListener('keydown', e => {
  if (recording || e.target.tagName === 'INPUT' && e.target.type !== 'range') return;
  if (e.code === 'Space') { e.preventDefault(); playEl.click(); }
  else if (e.code === 'ArrowRight') seek(t + 5);
  else if (e.code === 'ArrowLeft') seek(t - 5);
  else if (/^[1-8]$/.test(e.key) && CHAPTERS[+e.key - 1]) seek(CHAPTERS[+e.key - 1].t);
});

/* ================= 영상 저장(녹화) ================= */
let rec = null, chunks = [], recMime = '', discard = false;
function setBusy(b) {
  ['restart', 'vr'].forEach(id => $(id).disabled = b); playEl.disabled = b; seekEl.disabled = b;
  [...chipsEl.children].forEach(x => x.disabled = b); $('recbadge').hidden = !b;
  $('save').textContent = b ? '■ 녹화 취소' : '● 영상으로 저장';
}
function startRec() {
  if (!window.MediaRecorder || !view.captureStream) { msg.textContent = '이 브라우저는 녹화를 지원하지 않아요. Chrome 또는 Edge를 사용해 주세요.'; return; }
  const types = ['video/mp4;codecs=avc1', 'video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm', 'video/mp4'];
  recMime = types.find(x => MediaRecorder.isTypeSupported(x)) || '';
  const stream = view.captureStream(30);
  try { rec = new MediaRecorder(stream, { mimeType: recMime || undefined, videoBitsPerSecond: 3_500_000 }); }
  catch (err) { msg.textContent = '녹화를 시작하지 못했어요: ' + err.message; return; }
  chunks = []; discard = false;
  rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
  rec.onstop = () => {
    stream.getTracks().forEach(tr => tr.stop());
    recording = false; setBusy(false);
    if (discard) { msg.textContent = '녹화를 취소했어요.'; return; }
    const ext = (rec.mimeType || recMime).includes('mp4') ? 'mp4' : 'webm';
    const blob = new Blob(chunks, { type: rec.mimeType || recMime || 'video/webm' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `SP-운영설계-가상외래.${ext}`;
    document.body.appendChild(a); a.click(); a.remove();
    msg.textContent = `저장 완료: SP-운영설계-가상외래.${ext} (${(blob.size / 1048576).toFixed(1)}MB). 다운로드 폴더를 확인하세요.`;
    setTimeout(() => URL.revokeObjectURL(a.href), 60000);
  };
  recording = true; setBusy(true); seek(0); playing = true;
  msg.textContent = '녹화 중… 끝날 때까지 이 탭을 그대로 두세요.';
  rec.start(1000);
}
function stopRec(cancel) { if (rec && rec.state !== 'inactive') { discard = !!cancel; rec.stop(); } }
function onEnd() { if (recording) setTimeout(() => stopRec(false), 700); }
$('save').onclick = () => { if (recording) stopRec(true); else startRec(); };
document.addEventListener('visibilitychange', () => {
  if (document.hidden && recording) { stopRec(true); msg.textContent = '탭이 가려져서 녹화를 취소했어요. 다시 시도해 주세요.'; }
});

/* ================= WebXR (VR) ================= */
const VANTAGE = [
  { x: -8, z: -2, fx: -9, fz: -5 }, { x: -3, z: 4, fx: -7, fz: 1 }, { x: 2.0, z: -2.65, fx: 7, fz: -3 },
  { x: 6.0, z: -1.2, fx: 9, fz: -4 }, { x: 3, z: 3.5, fx: 9, fz: 7 },
];
let vrIdx = 0;
function teleport(v) { dolly.position.set(v.x, 0, v.z); dolly.rotation.y = Math.atan2(-(v.fx - v.x), -(v.fz - v.z)); }
const vrBtn = $('vr');
if (navigator.xr && navigator.xr.isSessionSupported) {
  navigator.xr.isSessionSupported('immersive-vr').then(ok => {
    if (!ok) { vrBtn.disabled = true; vrBtn.title = '이 기기/브라우저는 WebXR VR을 지원하지 않아요.'; vrBtn.textContent = '🥽 VR 미지원'; }
  }).catch(() => { vrBtn.disabled = true; });
} else { vrBtn.disabled = true; vrBtn.title = 'WebXR을 지원하지 않는 브라우저예요.'; vrBtn.textContent = '🥽 VR 미지원'; }
for (let k = 0; k < 2; k++) {
  const c = renderer.xr.getController(k); dolly.add(c);
  c.addEventListener('select', () => { if (!xrActive) return; vrIdx = (vrIdx + 1) % VANTAGE.length; teleport(VANTAGE[vrIdx]); });
}
vrBtn.onclick = async () => {
  if (recording) return;
  try {
    const session = await navigator.xr.requestSession('immersive-vr', { optionalFeatures: ['local-floor', 'bounded-floor'] });
    session.addEventListener('end', () => { xrActive = false; cur = -1; vrBtn.textContent = '🥽 VR로 보기'; });
    await renderer.xr.setSession(session);
    xrActive = true; vrIdx = 0;
    const s = SHOTS[8]; applyState({ ...s, labels: ['zones', 'roles', 'desk', 'bed', 'card', 'out', 'reception', 'waiting', 'entry'] });
    teleport(VANTAGE[0]); vrBtn.textContent = '🥽 VR 종료';
  } catch (err) { msg.textContent = 'VR을 시작하지 못했어요: ' + err.message; }
};

/* 디버그/테스트용 */
window.tour = { seek, get TOTAL() { return TOTAL; }, SHOTS, pause() { playing = false; }, play() { playing = true; }, get t() { return t; } };
</script>
</body>
